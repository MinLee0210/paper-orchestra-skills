name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills and check plugin manifests are in sync
        run: node scripts/skills.mjs check
      - name: npx skills discovers every skill
        run: |
          out="$(npx -y skills add . --list 2>&1)"
          echo "$out"
          ! echo "$out" | grep -q "Skipped"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pymupdf pillow

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-publishers texlive-science

      - name: Compile Python scripts
        run: python -m compileall -q skills

      - name: Run tests
        run: python -m pytest -q

      - name: Validate example inputs
        run: python skills/research-inputs/scripts/validate_inputs.py examples/paper-project

      - name: Compile bundled templates
        run: |
          set -euo pipefail
          for venue in cvpr2025 iclr2025 ieeeconf arxiv; do
            rm -rf "/tmp/template-$venue"
            python skills/research-template/scripts/init_template.py --venue "$venue" --out "/tmp/template-$venue"
            python skills/research-content-refinement/scripts/compile_latex.py \
              "/tmp/template-$venue" --name template --no-bib --timeout 60 --strict
          done

      - name: Run offline demo checks
        run: |
          python skills/research-orchestra/scripts/pipeline_status.py examples/paper-project || test $? -eq 2
          python skills/research-literature-review/scripts/build_bib.py \
            --registry tests/fixtures/registry.json --out /tmp/lit
          python skills/research-literature-review/scripts/inject_citations.py \
            --outline tests/fixtures/outline.json --registry tests/fixtures/registry.json \
            --out /tmp/lit/outline_v1.json
          python skills/research-literature-review/scripts/validate_literature.py \
            --dir /tmp/lit --outline /tmp/lit/outline_v1.json --registry tests/fixtures/registry.json \
            --min-papers 3
